<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Amnistía Tickets</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--pu3:#7c4dbd;--pu4:#a67de0;--pu5:#c9a8f0;--gold:#c9a84c;--wh4:rgba(255,255,255,0.12);--wh3:rgba(255,255,255,0.55);}
body{font-family:'Inter',sans-serif;background:#0f0f18;color:#fff;min-height:100vh;}

/* LOGIN */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.login-box{background:#1c1c28;border:1px solid var(--wh4);border-radius:16px;padding:36px 28px;width:100%;max-width:340px;text-align:center;}
.login-box h1{font-size:18px;font-weight:600;color:var(--pu5);margin-bottom:6px;}
.login-box p{font-size:12px;color:var(--wh3);margin-bottom:24px;}
.login-input{width:100%;background:rgba(255,255,255,0.06);border:1px solid var(--wh4);border-radius:8px;padding:11px 14px;color:#fff;font-size:14px;outline:none;font-family:'Inter',sans-serif;margin-bottom:12px;text-align:center;letter-spacing:2px;}
.login-input:focus{border-color:var(--pu3);}
.login-btn{width:100%;background:var(--pu3);color:#fff;border:none;border-radius:8px;padding:12px;font-size:13px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;}
.login-btn:hover{background:var(--pu4);}
.login-error{font-size:12px;color:#e24b4a;margin-top:8px;display:none;}

/* ADMIN */
#admin-screen{display:none;}
nav{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:rgba(15,15,24,0.96);border-bottom:1px solid var(--wh4);position:sticky;top:0;z-index:50;}
.nav-title{font-size:13px;font-weight:600;color:var(--pu5);}
.nav-out{font-size:11px;color:var(--wh3);cursor:pointer;background:none;border:none;font-family:'Inter',sans-serif;}
.nav-out:hover{color:#fff;}

.container{padding:20px;max-width:1000px;margin:0 auto;}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px;}
@media(max-width:600px){.stats-grid{grid-template-columns:repeat(2,1fr);}}
.stat-card{background:#1c1c28;border:1px solid var(--wh4);border-radius:12px;padding:16px;}
.stat-num{font-size:26px;font-weight:600;color:var(--pu5);margin-bottom:4px;}
.stat-lbl{font-size:11px;color:var(--wh3);}

/* TABS */
.tabs{display:flex;gap:6px;margin-bottom:20px;border-bottom:1px solid var(--wh4);padding-bottom:12px;}
.tab{padding:7px 16px;font-size:12px;cursor:pointer;border-radius:20px;border:1px solid var(--wh4);color:var(--wh3);background:transparent;font-family:'Inter',sans-serif;}
.tab.active{background:var(--pu3);border-color:var(--pu3);color:#fff;}

/* TABLA */
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12px;}
th{text-align:left;padding:10px 12px;font-size:10px;font-weight:500;color:var(--wh3);text-transform:uppercase;letter-spacing:0.5px;border-bottom:1px solid var(--wh4);}
td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,0.05);color:#fff;vertical-align:middle;}
tr:hover td{background:rgba(255,255,255,0.03);}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;}
.badge-ok{background:rgba(93,202,133,0.15);color:#5dca85;border:1px solid #2d6a2d;}
.badge-pend{background:rgba(232,168,48,0.15);color:#e8a830;border:1px solid #8a5a10;}
.badge-free{background:rgba(124,77,189,0.15);color:var(--pu5);border:1px solid var(--pu3);}

/* BOTONES */
.btn-sm{padding:5px 10px;border-radius:6px;font-size:10px;cursor:pointer;font-family:'Inter',sans-serif;border:none;}
.btn-purple{background:var(--pu3);color:#fff;}
.btn-purple:hover{background:var(--pu4);}
.btn-gold{background:rgba(201,168,76,0.2);color:var(--gold);border:1px solid rgba(201,168,76,0.3);}
.btn-gold:hover{background:rgba(201,168,76,0.3);}
.btn-red{background:rgba(226,75,74,0.15);color:#e24b4a;border:1px solid rgba(226,75,74,0.3);}
.btn-red:hover{background:rgba(226,75,74,0.25);}
.btn-green{background:rgba(93,202,133,0.15);color:#5dca85;border:1px solid #2d6a2d;}
.btn-green:hover{background:rgba(93,202,133,0.25);}

/* FORMS */
.form-box{background:#1c1c28;border:1px solid var(--wh4);border-radius:12px;padding:20px;margin-bottom:20px;}
.form-box h3{font-size:13px;font-weight:500;color:#fff;margin-bottom:14px;}
.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px;}
@media(max-width:600px){.form-grid{grid-template-columns:1fr;}}
.form-group label{font-size:10px;color:var(--wh3);display:block;margin-bottom:4px;}
.form-input{width:100%;background:rgba(255,255,255,0.06);border:1px solid var(--wh4);border-radius:7px;padding:8px 10px;color:#fff;font-size:12px;outline:none;font-family:'Inter',sans-serif;}
.form-input:focus{border-color:var(--pu3);}
select.form-input option{background:#1c1c28;}
.btn-primary{background:var(--pu3);color:#fff;border:none;border-radius:8px;padding:10px 20px;font-size:12px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;}
.btn-primary:hover{background:var(--pu4);}

/* MODAL */
.modal-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;align-items:center;justify-content:center;padding:16px;}
.modal-ov.show{display:flex;}
.modal-box{background:#1c1c28;border:1px solid var(--wh4);border-radius:14px;width:100%;max-width:400px;padding:24px;}
.modal-box h3{font-size:14px;font-weight:500;color:#fff;margin-bottom:16px;}
.modal-footer{display:flex;gap:8px;margin-top:16px;}

/* QR */
.qr-preview{text-align:center;padding:16px;background:rgba(255,255,255,0.03);border-radius:10px;margin-top:12px;}
.qr-preview img{border-radius:8px;border:3px solid #fff;}
.qr-code-text{font-family:monospace;font-size:11px;color:var(--wh3);margin-top:6px;}

.loading{text-align:center;padding:40px;color:var(--wh3);font-size:13px;}
.empty{text-align:center;padding:40px;color:rgba(255,255,255,0.2);font-size:13px;}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <h1>Amnistía Admin</h1>
    <p>Ingresa la contraseña para continuar</p>
    <input class="login-input" type="password" id="pwd-input" placeholder="••••••••••" onkeydown="if(event.key==='Enter')login()"/>
    <button class="login-btn" onclick="login()">Entrar</button>
    <div class="login-error" id="login-error">Contraseña incorrecta</div>
  </div>
</div>

<!-- ADMIN -->
<div id="admin-screen">
  <nav>
    <div class="nav-title">🎵 Amnistía — Panel Admin</div>
    <button class="nav-out" onclick="logout()">Cerrar sesión</button>
  </nav>

  <div class="container">

    <!-- STATS -->
    <div class="stats-grid" id="stats-grid">
      <div class="stat-card"><div class="stat-num" id="st-vendidos">—</div><div class="stat-lbl">Lugares vendidos</div></div>
      <div class="stat-card"><div class="stat-num" id="st-compras">—</div><div class="stat-lbl">Compras totales</div></div>
      <div class="stat-card"><div class="stat-num" id="st-recaudado">—</div><div class="stat-lbl">Total recaudado</div></div>
      <div class="stat-card"><div class="stat-num" id="st-cortesias">—</div><div class="stat-lbl">Cortesías</div></div>
    </div>

    <!-- TABS -->
    <div class="tabs">
      <button class="tab active" onclick="switchTab('compradores')">Compradores</button>
      <button class="tab" onclick="switchTab('cortesias')">Agregar cortesía</button>
    </div>

    <!-- TAB COMPRADORES -->
    <div id="tab-compradores">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px;">
        <input class="form-input" style="max-width:260px;" type="text" placeholder="Buscar nombre o mesa..." id="search-input" oninput="filtrarTabla()"/>
        <button class="btn-primary" onclick="exportarCSV()">⬇ Exportar CSV</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Email</th>
              <th>Teléfono</th>
              <th>Mesa</th>
              <th>Piso</th>
              <th>Lugares</th>
              <th>Total</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-body">
            <tr><td colspan="9" class="loading">Cargando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- TAB CORTESIAS -->
    <div id="tab-cortesias" style="display:none;">
      <div class="form-box">
        <h3>Agregar cortesía</h3>
        <div class="form-grid">
          <div class="form-group"><label>Nombre *</label><input class="form-input" id="c-nombre" type="text" placeholder="Nombre completo"/></div>
          <div class="form-group"><label>Email</label><input class="form-input" id="c-email" type="email" placeholder="correo@ejemplo.com"/></div>
          <div class="form-group"><label>Teléfono</label><input class="form-input" id="c-tel" type="tel" placeholder="10 dígitos"/></div>
          <div class="form-group">
            <label>Mesa *</label>
            <select class="form-input" id="c-mesa">
              <option value="">Selecciona mesa</option>
              <optgroup label="Planta Baja — Zona C">
                <option value="C0|pb">C0</option><option value="C1|pb">C1</option><option value="C2|pb">C2</option><option value="C3|pb">C3</option>
                <option value="C4|pb">C4</option><option value="C5|pb">C5</option><option value="C6|pb">C6</option><option value="C7|pb">C7</option>
                <option value="C8|pb">C8</option><option value="C9|pb">C9</option><option value="C10|pb">C10</option><option value="C11|pb">C11</option>
              </optgroup>
              <optgroup label="Planta Baja — Zona P">
                <option value="P1|pb">P1</option><option value="P2|pb">P2</option><option value="P3|pb">P3</option><option value="P4|pb">P4</option>
                <option value="P5|pb">P5</option><option value="P6|pb">P6</option><option value="P7|pb">P7</option><option value="P8|pb">P8</option>
                <option value="P9|pb">P9</option><option value="P10|pb">P10</option><option value="P11|pb">P11</option><option value="P12|pb">P12</option><option value="P13|pb">P13</option>
              </optgroup>
              <optgroup label="Planta Baja — Escenario">
                <option value="E1|pb">E1</option><option value="E2|pb">E2</option><option value="E3|pb">E3</option><option value="E4|pb">E4</option>
                <option value="E5|pb">E5</option><option value="E6|pb">E6</option><option value="E7|pb">E7</option><option value="E9|pb">E9</option>
              </optgroup>
              <optgroup label="Planta Alta">
                <option value="B1|pa">B1</option><option value="B2|pa">B2</option><option value="B3|pa">B3</option><option value="B4|pa">B4</option>
                <option value="B5|pa">B5</option><option value="B6|pa">B6</option><option value="B7|pa">B7</option><option value="B8|pa">B8</option>
                <option value="B9|pa">B9</option><option value="B10|pa">B10</option><option value="B11|pa">B11</option><option value="B12|pa">B12</option>
                <option value="B13|pa">B13</option><option value="B14|pa">B14</option><option value="B15|pa">B15</option>
                <option value="VIP1|pa">VIP1</option><option value="VIP2|pa">VIP2</option>
                <option value="BB1|pa">BB1</option><option value="BB2|pa">BB2</option><option value="BB3|pa">BB3</option><option value="BB4|pa">BB4</option>
              </optgroup>
            </select>
          </div>
          <div class="form-group"><label>Lugares *</label><input class="form-input" id="c-lugares" type="number" min="1" max="20" value="1"/></div>
          <div class="form-group"><label>Nota (opcional)</label><input class="form-input" id="c-nota" type="text" placeholder="Ej: Artista invitado"/></div>
        </div>
        <button class="btn-primary" onclick="agregarCortesia()">Agregar cortesía</button>
        <div id="cortesia-msg" style="font-size:12px;margin-top:10px;"></div>
      </div>
    </div>

  </div>
</div>

<!-- MODAL MOVER MESA -->
<div class="modal-ov" id="modal-mover">
  <div class="modal-box">
    <h3>Mover a otra mesa</h3>
    <div class="form-group" style="margin-bottom:10px;"><label>Nueva mesa</label><input class="form-input" id="nueva-mesa" type="text" placeholder="Ej: C5"/></div>
    <div class="form-group"><label>Nuevo piso</label>
      <select class="form-input" id="nuevo-piso">
        <option value="pb">Planta Baja</option>
        <option value="pa">Planta Alta</option>
      </select>
    </div>
    <div class="modal-footer">
      <button class="btn-primary" onclick="confirmarMover()">Confirmar</button>
      <button class="btn-sm" style="background:rgba(255,255,255,0.06);color:var(--wh3);padding:10px 16px;border-radius:8px;font-size:12px;" onclick="cerrarModal('modal-mover')">Cancelar</button>
    </div>
  </div>
</div>

<!-- MODAL VER QR -->
<div class="modal-ov" id="modal-qr">
  <div class="modal-box" style="text-align:center;">
    <h3>Código QR</h3>
    <div class="qr-preview" id="qr-preview-content"></div>
    <div class="modal-footer" style="justify-content:center;">
      <button class="btn-primary" onclick="reenviarCorreo()">📧 Reenviar correo</button>
      <button class="btn-sm" style="background:rgba(255,255,255,0.06);color:var(--wh3);padding:10px 16px;border-radius:8px;font-size:12px;" onclick="cerrarModal('modal-qr')">Cerrar</button>
    </div>
    <div id="reenvio-msg" style="font-size:11px;margin-top:8px;"></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://isimdeobpvadbwsrauon.supabase.co';
const SUPABASE_KEY = 'sb_publishable_hNlQDPJ-Vl2YFUYg3K2Zsw_HHmX1xuK';
const PASSWORD = 'AMNISTIA12345';

let ventas = [];
let ventaSeleccionada = null;
let ticketSeleccionado = null;

// LOGIN
function login(){
  const pwd = document.getElementById('pwd-input').value;
  if(pwd === PASSWORD){
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-screen').style.display = 'block';
    cargarDatos();
  } else {
    document.getElementById('login-error').style.display = 'block';
  }
}
function logout(){
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('admin-screen').style.display = 'none';
  document.getElementById('pwd-input').value = '';
}

// TABS
function switchTab(tab){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',['compradores','cortesias'][i]===tab));
  document.getElementById('tab-compradores').style.display = tab==='compradores'?'block':'none';
  document.getElementById('tab-cortesias').style.display = tab==='cortesias'?'block':'none';
}

// CARGAR DATOS
async function cargarDatos(){
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/ventas?select=*&order=created_at.desc`, {
      headers:{ 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
    });
    ventas = await res.json();
    renderStats();
    renderTabla(ventas);
  } catch(e) {
    document.getElementById('tabla-body').innerHTML = '<tr><td colspan="9" class="empty">Error cargando datos</td></tr>';
  }
}

function renderStats(){
  const aprobadas = ventas.filter(v=>v.estado==='aprobado');
  const cortesias = ventas.filter(v=>v.total===0&&v.estado==='aprobado');
  const totalLugares = aprobadas.reduce((a,v)=>a+v.lugares,0);
  const totalRecaudado = aprobadas.filter(v=>v.total>0).reduce((a,v)=>a+parseFloat(v.total),0);
  document.getElementById('st-vendidos').textContent = totalLugares;
  document.getElementById('st-compras').textContent = aprobadas.length;
  document.getElementById('st-recaudado').textContent = '$'+totalRecaudado.toLocaleString('es-MX');
  document.getElementById('st-cortesias').textContent = cortesias.length;
}

function renderTabla(data){
  const tbody = document.getElementById('tabla-body');
  if(!data||data.length===0){
    tbody.innerHTML='<tr><td colspan="9" class="empty">No hay registros</td></tr>';
    return;
  }
  tbody.innerHTML = data.map(v=>`
    <tr data-id="${v.id}">
      <td>${v.comprador_nombre||'—'}</td>
      <td style="font-size:11px;color:var(--wh3);">${v.comprador_email||'—'}</td>
      <td style="font-size:11px;color:var(--wh3);">${v.comprador_tel||'—'}</td>
      <td><strong>${v.mesa_id}</strong></td>
      <td>${v.piso==='pb'?'PB':'PA'}</td>
      <td>${v.lugares}</td>
      <td style="color:${v.total===0?'var(--gold)':'#5dca85'};">${v.total===0?'Cortesía':'$'+parseFloat(v.total).toLocaleString('es-MX')}</td>
      <td><span class="badge ${v.estado==='aprobado'?'badge-ok':v.estado==='pendiente'?'badge-pend':'badge-free'}">${v.estado}</span></td>
      <td style="display:flex;gap:5px;flex-wrap:wrap;">
        <button class="btn-sm btn-purple" onclick="verQR('${v.id}','${v.mesa_id}')">QR</button>
        <button class="btn-sm btn-gold" onclick="abrirMover('${v.id}')">Mover</button>
      </td>
    </tr>`).join('');
}

function filtrarTabla(){
  const q = document.getElementById('search-input').value.toLowerCase();
  const filtradas = ventas.filter(v=>
    (v.comprador_nombre||'').toLowerCase().includes(q) ||
    (v.mesa_id||'').toLowerCase().includes(q) ||
    (v.comprador_email||'').toLowerCase().includes(q)
  );
  renderTabla(filtradas);
}

// VER QR
async function verQR(ventaId, mesaId){
  ventaSeleccionada = ventaId;
  // Buscar ticket
  const res = await fetch(`${SUPABASE_URL}/rest/v1/tickets?venta_id=eq.${ventaId}&select=codigo,usado&limit=1`, {
    headers:{ 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
  });
  const tickets = await res.json();
  let codigo = tickets&&tickets[0] ? tickets[0].codigo : `AMN-${ventaId.slice(0,8).toUpperCase()}-${mesaId}`;
  ticketSeleccionado = { codigo, ventaId };
  const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(codigo)}&bgcolor=ffffff&color=1a0f2e&margin=10`;
  document.getElementById('qr-preview-content').innerHTML = `
    <img src="${qrUrl}" style="width:180px;height:180px;"/>
    <div class="qr-code-text">${codigo}</div>
    ${tickets&&tickets[0]&&tickets[0].usado?'<div style="color:#e8a830;font-size:11px;margin-top:6px;">⚠️ Ya fue utilizado</div>':''}`;
  document.getElementById('reenvio-msg').textContent = '';
  document.getElementById('modal-qr').classList.add('show');
}

async function reenviarCorreo(){
  if(!ticketSeleccionado) return;
  document.getElementById('reenvio-msg').textContent = 'Reenviando...';
  try {
    const res = await fetch('/api/reenviar-ticket', {
      method: 'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ venta_id: ticketSeleccionado.ventaId })
    });
    const data = await res.json();
    document.getElementById('reenvio-msg').textContent = data.ok ? '✅ Correo reenviado' : '❌ Error: '+data.error;
  } catch(e) {
    document.getElementById('reenvio-msg').textContent = '❌ Error de conexión';
  }
}

// MOVER MESA
function abrirMover(ventaId){
  ventaSeleccionada = ventaId;
  document.getElementById('nueva-mesa').value = '';
  document.getElementById('modal-mover').classList.add('show');
}

async function confirmarMover(){
  const nuevaMesa = document.getElementById('nueva-mesa').value.trim().toUpperCase();
  const nuevoPiso = document.getElementById('nuevo-piso').value;
  if(!nuevaMesa){ alert('Ingresa el nombre de la mesa'); return; }

  // Actualizar venta
  await fetch(`${SUPABASE_URL}/rest/v1/ventas?id=eq.${ventaSeleccionada}`, {
    method: 'PATCH',
    headers:{ 'Content-Type':'application/json', 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` },
    body: JSON.stringify({ mesa_id: nuevaMesa, piso: nuevoPiso })
  });

  // Actualizar ticket — nuevo código con nueva mesa
  const nuevoCodeRes = await fetch(`${SUPABASE_URL}/rest/v1/tickets?venta_id=eq.${ventaSeleccionada}&select=id`, {
    headers:{ 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
  });
  const tickets = await nuevoCodeRes.json();
  if(tickets&&tickets[0]){
    const nuevoCodigo = `AMN-${ventaSeleccionada.slice(0,8).toUpperCase()}-${nuevaMesa}`;
    await fetch(`${SUPABASE_URL}/rest/v1/tickets?venta_id=eq.${ventaSeleccionada}`, {
      method: 'PATCH',
      headers:{ 'Content-Type':'application/json', 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` },
      body: JSON.stringify({ codigo: nuevoCodigo, mesa_id: nuevaMesa, piso: nuevoPiso })
    });
  }

  cerrarModal('modal-mover');
  alert(`✅ Mesa actualizada a ${nuevaMesa} · ${nuevoPiso==='pb'?'Planta Baja':'Planta Alta'}`);
  cargarDatos();
}

// AGREGAR CORTESIA
async function agregarCortesia(){
  const nombre = document.getElementById('c-nombre').value.trim();
  const email = document.getElementById('c-email').value.trim();
  const tel = document.getElementById('c-tel').value.trim();
  const mesaVal = document.getElementById('c-mesa').value;
  const lugares = parseInt(document.getElementById('c-lugares').value)||1;
  const msg = document.getElementById('cortesia-msg');

  if(!nombre||!mesaVal){ msg.style.color='#e24b4a'; msg.textContent='Nombre y mesa son requeridos'; return; }

  const [mesaId, piso] = mesaVal.split('|');
  msg.textContent = 'Guardando...'; msg.style.color = 'var(--wh3)';

  const res = await fetch(`${SUPABASE_URL}/rest/v1/ventas`, {
    method: 'POST',
    headers:{ 'Content-Type':'application/json', 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Prefer':'return=representation' },
    body: JSON.stringify({ comprador_nombre: nombre, comprador_email: email, comprador_tel: tel, mesa_id: mesaId, piso, lugares, total: 0, estado: 'aprobado' })
  });
  const venta = await res.json();

  if(venta&&venta[0]){
    // Generar ticket
    const codigo = `AMN-${venta[0].id.slice(0,8).toUpperCase()}-${mesaId}`;
    await fetch(`${SUPABASE_URL}/rest/v1/tickets`, {
      method: 'POST',
      headers:{ 'Content-Type':'application/json', 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` },
      body: JSON.stringify({ venta_id: venta[0].id, codigo, mesa_id: mesaId, piso, lugar_num: 1, usado: false })
    });
    msg.style.color = '#5dca85';
    msg.textContent = `✅ Cortesía agregada · Código: ${codigo}`;
    document.getElementById('c-nombre').value='';
    document.getElementById('c-email').value='';
    document.getElementById('c-tel').value='';
    document.getElementById('c-lugares').value='1';
    cargarDatos();
  } else {
    msg.style.color='#e24b4a'; msg.textContent='Error al guardar';
  }
}

// EXPORTAR CSV
function exportarCSV(){
  const headers = ['Nombre','Email','Teléfono','Mesa','Piso','Lugares','Total','Estado'];
  const rows = ventas.map(v=>[
    v.comprador_nombre||'',
    v.comprador_email||'',
    v.comprador_tel||'',
    v.mesa_id||'',
    v.piso==='pb'?'Planta Baja':'Planta Alta',
    v.lugares||0,
    v.total===0?'Cortesía':'$'+parseFloat(v.total).toLocaleString('es-MX'),
    v.estado||''
  ]);
  const csv = [headers,...rows].map(r=>r.map(c=>`"${c}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='amnistia-compradores.csv'; a.click();
}

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Error en el pago — Amnistía</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:#1a0f2e;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.box{background:#1c1c28;border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:48px 32px;text-align:center;max-width:420px;width:100%;}
.icon{width:72px;height:72px;background:rgba(226,75,74,0.15);border:2px solid #a32d2d;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;}
.icon svg{width:36px;height:36px;color:#e24b4a;}
h1{font-size:22px;font-weight:600;margin-bottom:8px;}
p{font-size:14px;color:rgba(255,255,255,0.5);line-height:1.6;margin-bottom:28px;}
.btns{display:flex;flex-direction:column;gap:10px;}
.btn-primary{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:#7c4dbd;color:#fff;border:none;border-radius:24px;padding:12px 28px;font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;}
.btn-primary:hover{background:#a67de0;}
.btn-sec{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:transparent;color:rgba(255,255,255,0.4);border:1px solid rgba(255,255,255,0.1);border-radius:24px;padding:12px 28px;font-size:13px;cursor:pointer;text-decoration:none;}
.btn-sec:hover{color:#fff;}
</style>
</head>
<body>
<div class="box">
  <div class="icon">
    <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </div>
  <h1>Hubo un problema</h1>
  <p>El pago no pudo procesarse. No se realizó ningún cargo. Puedes intentarlo de nuevo o contactarnos.</p>
  <div class="btns">
    <a href="mapa.html" class="btn-primary">Intentar de nuevo</a>
    <a href="index.html" class="btn-sec">Volver al inicio</a>
  </div>
</div>
</body>
</html>

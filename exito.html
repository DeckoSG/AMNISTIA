<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pago exitoso — Amnistía</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:#1a0f2e;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.box{background:#1c1c28;border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:48px 32px;text-align:center;max-width:420px;width:100%;}
.icon{width:72px;height:72px;background:rgba(93,202,133,0.15);border:2px solid #2d6a2d;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;}
.icon svg{width:36px;height:36px;color:#5dca85;}
h1{font-size:22px;font-weight:600;margin-bottom:8px;}
p{font-size:14px;color:rgba(255,255,255,0.5);line-height:1.6;margin-bottom:24px;}
.ticket-ref{font-size:11px;color:rgba(255,255,255,0.25);margin-bottom:28px;font-family:monospace;}
.btn{display:inline-flex;align-items:center;gap:6px;background:#7c4dbd;color:#fff;border:none;border-radius:24px;padding:12px 28px;font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;}
.btn:hover{background:#a67de0;}
</style>
</head>
<body>
<div class="box">
  <div class="icon">
    <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
  </div>
  <h1>¡Pago completado!</h1>
  <p>Tu ticket fue procesado exitosamente. Recibirás un correo de confirmación con tu código QR de acceso.</p>
  <div class="ticket-ref" id="ref"></div>
  <a href="index.html" class="btn">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
    Volver al inicio
  </a>
</div>
<script>
const params = new URLSearchParams(window.location.search);
const ref = params.get('external_reference');
if(ref) document.getElementById('ref').textContent = 'Referencia: ' + ref;
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pago pendiente — Amnistía</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:#1a0f2e;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.box{background:#1c1c28;border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:48px 32px;text-align:center;max-width:420px;width:100%;}
.icon{width:72px;height:72px;background:rgba(186,117,23,0.15);border:2px solid #854f0b;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;}
.icon svg{width:36px;height:36px;color:#e8a830;}
h1{font-size:22px;font-weight:600;margin-bottom:8px;}
p{font-size:14px;color:rgba(255,255,255,0.5);line-height:1.6;margin-bottom:28px;}
.btn{display:inline-flex;align-items:center;gap:6px;background:#7c4dbd;color:#fff;border:none;border-radius:24px;padding:12px 28px;font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;}
.btn:hover{background:#a67de0;}
</style>
</head>
<body>
<div class="box">
  <div class="icon">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
  </div>
  <h1>Pago en proceso</h1>
  <p>Tu pago está siendo procesado. Recibirás una confirmación por correo en cuanto se acredite. Esto puede tardar unos minutos.</p>
  <a href="index.html" class="btn">Volver al inicio</a>
</div>
</body>
</html>
